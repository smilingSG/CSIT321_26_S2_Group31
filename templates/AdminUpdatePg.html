<!DOCTYPE html>
<html>
<head>
    <title>Update User Account - Lazarus</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='AdminUpdatePg.css') }}" rel="stylesheet">
</head>

<body>
    <main class="update-page">
        <section class="update-panel">
            <h1>Update User Account</h1>
            <p class="panel-subtitle">Edit the selected user's name, email, and role in one form.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="page-messages">
                        {% for category, message in messages %}
                            <div class="page-message {{ category }}">{{ message }}</div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('admin_update_bp.updateUser', user_id=user.userID) }}">
                <label for="update_username">Name</label>
                <input
                    type="text"
                    id="update_username"
                    name="username"
                    value="{{ user.username }}"
                    required
                >

                <label for="update_email">Email</label>
                <input
                    type="email"
                    id="update_email"
                    name="email"
                    value="{{ user.email }}"
                    required
                >

                <label for="update_role">Role</label>
                <select id="update_role" name="role" required>
                    <option value="user" {% if user.role == "user" %}selected{% endif %}>User</option>
                    <option value="user_admin" {% if user.role == "user_admin" %}selected{% endif %}>User Admin</option>
                    <option value="system_admin" {% if user.role == "system_admin" %}selected{% endif %}>System Admin</option>
                </select>

                <div class="page-actions">
                    <button type="submit" class="primary-action">Save Changes</button>
                    <a href="{{ url_for('user_management_bp.userManagement') }}" class="secondary-action">Cancel</a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
