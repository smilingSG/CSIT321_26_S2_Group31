<!DOCTYPE html>
<html>
<head>
    <title>User Dashboard - Lazarus</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='dashboard.css') }}" rel="stylesheet">
</head>

<body>
    <div class="dashboard-shell">
        <aside class="sidebar">
            <div class="brand-block">
                <a href="/dashboard" class="logo-box" aria-label="Lazarus dashboard">
                    <img src="{{ url_for('static', filename='lazarus-logo.png') }}" alt="Lazarus logo">
                </a>

                <div>
                    <h3>Lazarus</h3>
                </div>
            </div>

            <nav class="nav-stack">
                <a href="/dashboard" class="nav-link active">Dashboard</a>
                <a href="/upload" class="nav-link">Upload File</a>
                <a href="/files" class="nav-link">File Management</a>
                <a href="/shared" class="nav-link">Shared Files</a>
                <a href="/download" class="nav-link">Download & Access</a>
            </nav>

            <a href="/logout" class="nav-link logout">Logout</a>
        </aside>

        <a href="/profile" class="profile-fab" aria-label="Profile">
            <span class="profile-fab-head"></span>
            <span class="profile-fab-body"></span>
        </a>

        <main class="main-content">
            <section class="hero-panel">
                <div class="hero-copy">
                    <h1>Welcome back, {{ username or "User" }}</h1>
                    <a href="/upload" class="upload-control" aria-label="Upload new file">
                        <span class="security-ring">
                            <span class="ring-core">+</span>
                        </span>
                        <span class="upload-text">Upload File</span>
                    </a>
                </div>
                <div class="hero-visual" aria-hidden="true">
                    <div class="hero-logo">
                        <img src="{{ url_for('static', filename='lazarus-logo.png') }}" alt="">
                    </div>
                </div>
            </section>

            <div class="row g-4 stats-grid">
                <div class="col-md-4">
                    <a href="/files" class="dashboard-card dashboard-card-link card-files">
                        <p>Total Files</p>
                        <h2>{{ data.total_files }}</h2>
                    </a>
                </div>

                <div class="col-md-4">
                    <a href="/shared" class="dashboard-card dashboard-card-link card-shared">
                        <p>Shared Files</p>
                        <h2>{{ data.shared_files }}</h2>
                    </a>
                </div>

                <div class="col-md-4">
                    <a href="/recovery" class="dashboard-card dashboard-card-link card-recovery">
                        <p>Restored Files</p>
                        <h2>{{ data.recovered_files }}</h2>
                    </a>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
