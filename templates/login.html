<!DOCTYPE html>
<html>
<head>
    <title>Login - Lazarus</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='login.css') }}" rel="stylesheet">
</head>

<body>
    <main class="login-page">
        <section class="login-panel">
            <p class="page-tag">Login Page</p>
            <h1>Secure access by role</h1>

            {% if error %}
                <div class="alert alert-danger" role="alert">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST" action="{{ url_for('login_bp.login') }}">
                <div class="mb-4">
                    <label for="login_credential" class="form-label">Email / Username</label>
                    <input
                        type="text"
                        class="form-control"
                        id="login_credential"
                        name="login_credential"
                        value="{{ login_credential or '' }}"
                        placeholder="Enter login credential"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <div class="password-field">
                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            placeholder="Enter password"
                            autocomplete="current-password"
                            required
                        >
                        <button type="button" class="password-toggle" aria-label="Show password">
                            <svg class="eye-icon eye-open" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M2.1 12s3.5-6 9.9-6 9.9 6 9.9 6-3.5 6-9.9 6-9.9-6-9.9-6Z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="eye-icon eye-closed" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M2.1 12s3.5-6 9.9-6c2 0 3.7.5 5.2 1.3"></path>
                                <path d="M21.9 12s-3.5 6-9.9 6c-2 0-3.7-.5-5.2-1.3"></path>
                                <path d="M9.9 9.9A3 3 0 0 1 14.1 14.1"></path>
                                <path d="M3 3l18 18"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <input
                    type="hidden"
                    id="selected_role"
                    name="selected_role"
                    value="{{ selected_role or 'user' }}"
                >

                <div class="role-actions" aria-label="Login role">
                    <button type="submit" class="role-button" data-role="user">
                        Login as User
                    </button>
                    <button type="submit" class="role-button" data-role="user_admin">
                        User Admin
                    </button>
                    <button type="submit" class="role-button" data-role="system_admin">
                        System Admin
                    </button>
                </div>

                <div class="support-links">
                    <a href="{{ url_for('register_bp.register') }}">Register</a>
                    <a href="{{ url_for('password_reset_bp.resetPassword') }}">Forgot Password?</a>
                </div>
            </form>
        </section>
    </main>

    <script>
        document.querySelectorAll(".role-button").forEach(function(button) {
            button.addEventListener("click", function() {
                document.getElementById("selected_role").value = button.dataset.role;
            });
        });

        const passwordInput = document.getElementById("password");
        const passwordToggle = document.querySelector(".password-toggle");

        passwordToggle.addEventListener("click", function() {
            const isHidden = passwordInput.type === "password";
            passwordInput.type = isHidden ? "text" : "password";
            passwordToggle.classList.toggle("is-visible", isHidden);
            passwordToggle.setAttribute("aria-label", isHidden ? "Hide password" : "Show password");
        });
    </script>
</body>
</html>
