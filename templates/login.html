<!DOCTYPE html>
<html>
<head>
    <title>Login - Lazarus</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='login.css') }}" rel="stylesheet">
</head>

<body>
    <main class="login-page">
        <section class="login-panel">
            <p class="page-tag">Login Page</p>
            <h1>Secure access by role</h1>

            {% if error %}
                <div class="alert alert-danger" role="alert">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST" action="{{ url_for('login_bp.login') }}">
                <div class="mb-4">
                    <label for="login_credential" class="form-label">Email / Username</label>
                    <input
                        type="text"
                        class="form-control"
                        id="login_credential"
                        name="login_credential"
                        value="{{ login_credential or '' }}"
                        placeholder="Enter login credential"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <div class="policy-note">
                    System verifies credentials and applies authentication policies before redirecting by role.
                </div>

                <input
                    type="hidden"
                    id="selected_role"
                    name="selected_role"
                    value="{{ selected_role or 'user' }}"
                >

                <div class="role-actions" aria-label="Login role">
                    <button type="submit" class="role-button" data-role="user">
                        Login as User
                    </button>
                    <button type="submit" class="role-button" data-role="user_admin">
                        User Admin
                    </button>
                    <button type="submit" class="role-button" data-role="system_admin">
                        System Admin
                    </button>
                </div>

                <div class="support-links">
                    <a href="#">Register</a>
                    <a href="#">Forgot Password?</a>
                </div>
            </form>
        </section>
    </main>

    <script>
        document.querySelectorAll(".role-button").forEach(function(button) {
            button.addEventListener("click", function() {
                document.getElementById("selected_role").value = button.dataset.role;
            });
        });
    </script>
</body>
</html>
