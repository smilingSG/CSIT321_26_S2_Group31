<!DOCTYPE html>
<html>
<head>
    <title>Reset Password - Lazarus</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='reset_password.css') }}" rel="stylesheet">
</head>

<body>
    <main class="reset-page">
        <section class="reset-panel">
            <p class="page-tag">Reset Password Page</p>
            <h1>Reset your password</h1>

            {% if error %}
                <div class="alert alert-danger" role="alert">
                    {{ error }}
                </div>
            {% endif %}

            {% if success %}
                <div class="alert alert-success" role="alert">
                    {{ success }}
                </div>
            {% endif %}

            <form method="POST" action="{{ url_for('password_reset_bp.resetPassword') }}">
                <div class="mb-4">
                    <label for="email" class="form-label">Registered Email Address</label>
                    <div class="email-row">
                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            value="{{ email or '' }}"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >
                        <button type="submit" name="action" value="send_code" class="send-button">
                            Send Email
                        </button>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="token" class="form-label">Verification Code / Reset Link</label>
                    <input
                        type="text"
                        class="form-control"
                        id="token"
                        name="token"
                        value="{{ token or '' }}"
                        placeholder="Enter code or token"
                        autocomplete="one-time-code"
                    >
                </div>

                <div class="mb-4">
                    <label for="new_password" class="form-label">New Password</label>
                    <input
                        type="password"
                        class="form-control"
                        id="new_password"
                        name="new_password"
                        placeholder="Create new password"
                        autocomplete="new-password"
                    >
                </div>

                <div class="reset-actions">
                    <button type="submit" name="action" value="update_password" class="primary-action">
                        Update Password
                    </button>
                    <a href="{{ url_for('login_bp.login') }}" class="secondary-action">
                        Back to Login
                    </a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
