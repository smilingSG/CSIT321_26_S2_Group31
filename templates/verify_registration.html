<!DOCTYPE html>
<html>
<head>
    <title>Verify Account - Lazarus</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='register.css') }}" rel="stylesheet">
</head>

<body>
    <main class="register-page">
        <section class="register-panel">
            <p class="page-tag">Account Verification</p>
            <h1>Verify your Lazarus account</h1>

            {% if error %}
                <div class="alert alert-danger" role="alert">{{ error }}</div>
            {% endif %}

            {% if success %}
                <div class="alert alert-success" role="alert">{{ success }}</div>
            {% endif %}

            {% if not verified %}
                <form method="POST" action="{{ url_for('register_bp.verifyAccount') }}">
                    <div class="mb-4">
                        <label for="username" class="form-label">Username</label>
                        <input
                            type="text"
                            class="form-control"
                            id="username"
                            name="username"
                            value="{{ username or '' }}"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <div class="mb-4">
                        <label for="token" class="form-label">Verification Code</label>
                        <input
                            type="text"
                            class="form-control"
                            id="token"
                            name="token"
                            value="{{ token or '' }}"
                            autocomplete="one-time-code"
                            required
                        >
                    </div>

                    <div class="register-actions">
                        <button type="submit" class="primary-action">Verify Account</button>
                        <a href="{{ url_for('register_bp.register') }}" class="secondary-action">Back</a>
                    </div>
                </form>
            {% else %}
                <div class="register-actions">
                    <a href="{{ url_for('login_bp.login') }}" class="primary-action">Go to Login</a>
                </div>
            {% endif %}
        </section>
    </main>
</body>
</html>
