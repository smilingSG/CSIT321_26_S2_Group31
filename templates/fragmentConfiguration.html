<!DOCTYPE html>
<html>
<head>
    <title>Fragment Configuration - Lazarus</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='upload.css') }}" rel="stylesheet">

    <style>
        body.fragment-config-page {
            min-width: 1180px;
            min-height: 100vh;
            margin: 0;
            color: #07172f;
            font-family: Arial, Helvetica, sans-serif;
            background:
                linear-gradient(rgba(93, 130, 188, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(93, 130, 188, 0.08) 1px, transparent 1px),
                radial-gradient(circle at 24% 8%, rgba(47, 109, 246, 0.18), transparent 28rem),
                radial-gradient(circle at 82% 14%, rgba(35, 199, 189, 0.18), transparent 24rem),
                linear-gradient(135deg, #eef5ff 0%, #f8fbff 48%, #f3f7fb 100%);
            background-size: 66px 66px, 66px 66px, auto, auto, auto;
        }

        .fragment-config-page .page-wrapper {
            display: flex;
            min-height: 100vh;
            background: transparent;
        }

        .fragment-config-page .sidebar {
            width: 310px;
            min-height: 100vh;
            padding: 30px 22px;
            color: #07172f;
            display: flex;
            flex-direction: column;
            background:
                radial-gradient(circle at 20% 8%, rgba(35, 199, 189, 0.2), transparent 14rem),
                linear-gradient(180deg, rgba(255, 255, 255, 0.96) 0%, rgba(246, 250, 255, 0.94) 100%);
            box-shadow: 18px 0 44px rgba(15, 23, 42, 0.08);
            border-right: 1px solid rgba(148, 163, 184, 0.2);
        }

        .fragment-config-page .brand-row {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 34px;
        }

        .fragment-config-page .logo-box {
            width: 62px;
            height: 62px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: linear-gradient(135deg, #23c7bd, #2f6df6);
            box-shadow: 0 18px 35px rgba(47, 109, 246, 0.34);
            text-decoration: none;
        }

        .fragment-config-page .logo-box img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        .fragment-config-page .brand-title {
            color: #07172f;
            font-size: 31px;
            font-weight: 900;
            line-height: 1;
        }

        .fragment-config-page .nav-stack {
            display: grid;
            gap: 22px;
            margin-top: 38px;
        }

        .fragment-config-page .nav-item {
            min-height: 38px;
            display: flex;
            align-items: center;
            padding: 0 36px;
            border-radius: 8px;
            color: #43536b;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            transition: color 0.2s ease, background 0.2s ease;
        }

        .fragment-config-page .nav-item:hover,
        .fragment-config-page .nav-item.active {
            color: #07172f;
            background: rgba(47, 109, 246, 0.08);
        }

        .fragment-config-page .logout {
            margin-top: auto;
            padding-top: 28px;
            border-top: 1px solid rgba(148, 163, 184, 0.28);
        }

        .fragment-config-page .profile-fab {
            position: fixed;
            right: 18px;
            bottom: 18px;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: linear-gradient(135deg, #23c7bd, #2f6df6);
            box-shadow: 0 18px 34px rgba(7, 39, 95, 0.24);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            z-index: 20;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .fragment-config-page .profile-fab:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 22px 40px rgba(7, 39, 95, 0.3);
        }

        .fragment-config-page .profile-fab-head {
            position: absolute;
            top: 12px;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: white;
        }

        .fragment-config-page .profile-fab-body {
            position: absolute;
            left: 14px;
            bottom: 12px;
            width: 26px;
            height: 16px;
            border-radius: 16px 16px 6px 6px;
            background: white;
        }

        .fragment-config-page .main-area {
            flex: 1;
            min-width: 0;
        }

        .fragment-config-page .content-area {
            padding: 38px 42px;
        }

        .fragment-config-page .config-panel {
            width: 1020px;
            padding: 34px;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.86);
            border: 1px solid rgba(201, 216, 244, 0.92);
            box-shadow: 0 24px 54px rgba(88, 115, 166, 0.16);
        }

        .fragment-config-page .config-panel h1 {
            margin: 0 0 8px;
            color: #061027;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: -0.3px;
        }

        .fragment-config-page .config-subtitle {
            margin: 0 0 28px;
            color: #8393b2;
            font-size: 14px;
            font-weight: 600;
        }

        .fragment-config-page .config-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .fragment-config-page .config-field label {
            margin-bottom: 8px;
            color: #6f7f99;
            font-size: 14px;
            font-weight: 800;
        }

        .fragment-config-page .config-field input {
            width: 100%;
            height: 48px;
            padding: 0 18px;
            color: #52637d;
            font-size: 15px;
            font-weight: 600;
            border-radius: 14px;
            border: 1px solid #c7d6ef;
            background: rgba(255, 255, 255, 0.9);
            outline: none;
            box-shadow: none;
        }

        .fragment-config-page .config-field input:focus {
            border-color: #8fb4ff;
            box-shadow: 0 0 0 4px rgba(47, 109, 246, 0.1);
        }

        .fragment-config-page .config-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 24px;
        }

        .fragment-config-page .config-action-button {
            appearance: none;
            -webkit-appearance: none;
            box-sizing: border-box;
            height: 48px;
            padding: 0 22px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
        }

        .fragment-config-page .continue-button {
            width: 98px;
            color: #07172f;
            border: 1px solid transparent;
            background: linear-gradient(135deg, #25bed1 0%, #2f6df6 100%);
        }

        .fragment-config-page .back-button {
            width: 74px;
            color: #263a59;
            border: 1px solid #b8cef5;
            background: rgba(255, 255, 255, 0.9);
        }

        .fragment-config-page .error-message {
            margin: 0 0 22px;
            padding: 12px 16px;
            border-radius: 14px;
            color: #b42318;
            background: rgba(255, 87, 87, 0.09);
            border: 1px solid rgba(255, 87, 87, 0.24);
            font-size: 14px;
            font-weight: 700;
        }
    </style>
</head>

<body class="fragment-config-page">

<div class="page-wrapper">

    <aside class="sidebar">
        <div class="brand-row">
            <a href="/dashboard" class="logo-box" aria-label="Lazarus dashboard">
                <img src="{{ url_for('static', filename='lazarus-logo.png') }}" alt="Lazarus logo">
            </a>

            <div>
                <div class="brand-title">Lazarus</div>
            </div>
        </div>

        <nav class="nav-stack">
            <a href="/dashboard" class="nav-item" onclick="return handleExitFragmentConfigProcess('/dashboard')">Dashboard</a>
            <a href="/upload" class="nav-item active" onclick="return handleExitFragmentConfigProcess('/upload')">Upload File</a>
            <a href="/files" class="nav-item" onclick="return handleExitFragmentConfigProcess('/files')">File Management</a>
            <a href="/shared" class="nav-item" onclick="return handleExitFragmentConfigProcess('/shared')">Shared Files</a>
            <a href="/download" class="nav-item" onclick="return handleExitFragmentConfigProcess('/download')">Download</a>
        </nav>

        <a href="/logout" class="nav-item logout" onclick="return handleExitFragmentConfigProcess('/logout')">Logout</a>
    </aside>

    <a href="/profile" class="profile-fab" aria-label="Profile" onclick="return handleExitFragmentConfigProcess('/profile')">
        <span class="profile-fab-head"></span>
        <span class="profile-fab-body"></span>
    </a>

    <main class="main-area">
        <div class="content-area">
            <section class="config-panel">
                <h1>Fragment Configuration Page</h1>

                <p class="config-subtitle">
                    Define total fragments `n` and required reconstruction fragments `k`.
                </p>

                {% if errorMessage %}
                    <div class="error-message">
                        {{ errorMessage }}
                    </div>
                {% endif %}

                <form method="POST">
                    <div class="config-grid">
                        <div class="config-field">
                            <label for="total_fragments">
                                Total Number of Fragments (n)
                            </label>

                            <input
                                type="number"
                                id="total_fragments"
                                name="total_fragments"
                                min="2"
                                max="20"
                                value="{{ previewData.totalFragments if previewData.totalFragments else 5 }}"
                                required>
                        </div>

                        <div class="config-field">
                            <label for="required_fragments">
                                Required Fragments for Reconstruction (k)
                            </label>

                            <input
                                type="number"
                                id="required_fragments"
                                name="required_fragments"
                                min="1"
                                max="20"
                                value="{{ previewData.requiredFragments if previewData.requiredFragments else 3 }}"
                                required>
                        </div>
                    </div>

                    <div class="config-actions">
                        <button
                            type="submit"
                            class="config-action-button continue-button"
                            onclick="allowFragmentSubmit()">
                            Continue
                        </button>

                        <button
                            type="button"
                            class="config-action-button back-button"
                            onclick="goBackToPreview()">
                            Back
                        </button>
                    </div>
                </form>
            </section>
        </div>
    </main>

</div>

<script>
    var currentTempFileID = {{ previewData.fileID }};
    var allowSubmit = false;

    function allowFragmentSubmit() {
        allowSubmit = true;
        currentTempFileID = null;
    }

    function goBackToPreview() {
        currentTempFileID = null;
        window.location.href = "/upload/preview/{{ previewData.fileID }}";
    }

    function handleExitFragmentConfigProcess(targetURL) {

        if (currentTempFileID !== null && allowSubmit === false) {
            cancelTempUpload(currentTempFileID, targetURL);
            return false;
        }

        return true;
    }

    function cancelTempUpload(fileID, targetURL) {
        var xhr = new XMLHttpRequest();

        xhr.onload = function () {
            currentTempFileID = null;

            if (targetURL !== null) {
                window.location.href = targetURL;
            }
        };

        xhr.open("POST", "/upload/cancel/" + fileID, true);
        xhr.send();
    }
</script>

</body>
</html>
