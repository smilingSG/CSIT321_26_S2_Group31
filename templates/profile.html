<!DOCTYPE html>
<html>
<head>
    <title>Profile Settings - Lazarus</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='profile.css') }}" rel="stylesheet">
</head>

<body class="profile-page">
    <main class="profile-shell">
        <section class="profile-panel">
            <h1>Profile Settings</h1>
            <p class="profile-subtitle">Manage personal settings and account profile information.</p>

            {% if errorMessage %}
                <div class="profile-message error">{{ errorMessage }}</div>
            {% endif %}

            {% if successMessage %}
                <div class="profile-message success">{{ successMessage }}</div>
            {% endif %}

            <form class="profile-form" method="POST" action="{{ url_for('profile_bp.profilePage') }}">
                <label>
                    Display Name
                    <input
                        type="text"
                        name="display_name"
                        value="{{ userProfile.username }}"
                        autocomplete="username"
                        required
                    >
                </label>

                <label>
                    Email
                    <input
                        type="email"
                        name="email"
                        value="{{ userProfile.email }}"
                        readonly
                    >
                </label>

                <label>
                    New Password
                    <input
                        type="password"
                        name="new_password"
                        autocomplete="new-password"
                        placeholder="Leave blank to keep current password"
                    >
                </label>

                <label>
                    Confirm Password
                    <input
                        type="password"
                        name="confirm_password"
                        autocomplete="new-password"
                        placeholder="Confirm new password"
                    >
                </label>

                <button type="submit" class="save-profile-button">Save Profile</button>
                <button type="button" class="back-profile-button" onclick="window.history.back()">Back</button>
            </form>
        </section>
    </main>
</body>
</html>
