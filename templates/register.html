<!DOCTYPE html>
<html>
<head>
    <title>Register - Lazarus</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='register.css') }}" rel="stylesheet">
</head>

<body>
    <main class="register-page">
        <section class="register-panel">
            <p class="page-tag">Register Page</p>
            <h1>Create a Lazarus account</h1>

            {% if error %}
                <div class="alert alert-danger" role="alert">
                    {{ error }}
                </div>
            {% endif %}

            {% if success %}
                <div class="alert alert-success" role="alert">
                    {{ success }}
                </div>
            {% endif %}

            <form method="POST" action="{{ url_for('register_bp.register') }}">
                <div class="mb-4">
                    <label for="username" class="form-label">Username</label>
                    <input
                        type="text"
                        class="form-control"
                        id="username"
                        name="username"
                        value="{{ username or '' }}"
                        placeholder=""
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="mb-4">
                    <label for="email" class="form-label">Email</label>
                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        value="{{ email or '' }}"
                        placeholder=""
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <div class="password-field">
                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            placeholder=""
                            autocomplete="new-password"
                            required
                        >
                        <button type="button" class="password-toggle" data-target="password" aria-label="Show password">
                            <svg class="eye-icon eye-show" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M2.1 12s3.5-6 9.9-6 9.9 6 9.9 6-3.5 6-9.9 6-9.9-6-9.9-6Z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="eye-icon eye-hide" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M2.1 12s3.5-6 9.9-6c2.1 0 3.9.6 5.4 1.4"></path>
                                <path d="M21.9 12s-3.5 6-9.9 6c-2.1 0-3.9-.6-5.4-1.4"></path>
                                <path d="M9.9 9.9A3 3 0 0 1 14.1 14.1"></path>
                                <path d="M3 3l18 18"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="confirm_password" class="form-label">Confirm Password</label>
                    <div class="password-field">
                        <input
                            type="password"
                            class="form-control"
                            id="confirm_password"
                            name="confirm_password"
                            placeholder=""
                            autocomplete="new-password"
                            required
                        >
                        <button type="button" class="password-toggle" data-target="confirm_password" aria-label="Show confirm password">
                            <svg class="eye-icon eye-show" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M2.1 12s3.5-6 9.9-6 9.9 6 9.9 6-3.5 6-9.9 6-9.9-6-9.9-6Z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="eye-icon eye-hide" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M2.1 12s3.5-6 9.9-6c2.1 0 3.9.6 5.4 1.4"></path>
                                <path d="M21.9 12s-3.5 6-9.9 6c-2.1 0-3.9-.6-5.4-1.4"></path>
                                <path d="M9.9 9.9A3 3 0 0 1 14.1 14.1"></path>
                                <path d="M3 3l18 18"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="token" class="form-label">Verification Code / Register Link</label>
                    <input
                        type="text"
                        class="form-control"
                        id="token"
                        name="token"
                        value="{{ token or '' }}"
                        placeholder=""
                        autocomplete="one-time-code"
                    >
                </div>

                <div class="register-actions">
                    <button type="submit" name="action" value="send_code" class="primary-action">Send Email</button>
                    <button type="submit" name="action" value="verify_account" class="primary-action">Verify Account</button>
                    <a href="{{ url_for('login_bp.login') }}" class="secondary-action">Back</a>
                </div>
            </form>
        </section>
    </main>

    <script>
        document.querySelectorAll(".password-toggle").forEach(function(button) {
            button.addEventListener("click", function() {
                const input = document.getElementById(button.dataset.target);
                const isHidden = input.type === "password";
                input.type = isHidden ? "text" : "password";
                button.classList.toggle("is-visible", isHidden);
                button.setAttribute("aria-label", isHidden ? "Hide password" : "Show password");
            });
        });
    </script>
</body>
</html>
