<!DOCTYPE html>
<html>
<head>
    <title>Create User Account - Lazarus</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='AdminPg.css') }}" rel="stylesheet">
</head>

<body>
    <main class="create-page">
        <section class="create-panel">
            <h1>Create User Account</h1>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="page-messages">
                        {% for category, message in messages %}
                            <div class="page-message {{ category }}">{{ message }}</div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('admin_bp.createUser') }}">
                <label for="create_username">Name</label>
                <input
                    type="text"
                    id="create_username"
                    name="username"
                    placeholder="Enter username"
                    required
                >

                <label for="create_email">Email</label>
                <input
                    type="email"
                    id="create_email"
                    name="email"
                    placeholder="Enter email"
                    required
                >

                <label for="create_password">Password</label>
                <input
                    type="password"
                    id="create_password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

                <label for="create_role">Role</label>
                <select id="create_role" name="role" required>
                    <option value="user">User</option>
                    <option value="user_admin">User Admin</option>
                    <option value="system_admin">System Admin</option>
                </select>

                <div class="page-actions">
                    <button type="submit" class="primary-action">Create User</button>
                    <a href="{{ url_for('admin_search_bp.userManagement') }}" class="secondary-action">Cancel</a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
