<!DOCTYPE html>
<html>
<head>
    <title>Upload File - Lazarus</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='upload.css') }}" rel="stylesheet">
</head>

<body class="upload-page">
    <div class="page-wrapper">
        <div class="sidebar">
            <div class="brand-row">
                <a href="/dashboard" class="logo-box" aria-label="Lazarus dashboard">
                    <img src="{{ url_for('static', filename='lazarus-logo.png') }}" alt="Lazarus logo">
                </a>
                <div>
                    <div class="brand-title">Lazarus</div>
                </div>
            </div>

            <a href="/dashboard" class="nav-item" onclick="return handleExitUploadProcess('/dashboard')">Dashboard</a>
            <a href="/upload" class="nav-item active">Upload File</a>
            <a href="/files" class="nav-item" onclick="return handleExitUploadProcess('/files')">File Management</a>
            <a href="/shared" class="nav-item" onclick="return handleExitUploadProcess('/shared')">Shared Files</a>
            <a href="/download" class="nav-item" onclick="return handleExitUploadProcess('/download')">Download & Access</a>
            <a href="/logout" class="nav-item logout" onclick="return handleExitUploadProcess('/logout')">Logout</a>
        </div>

        <a href="/profile" class="profile-fab" aria-label="Profile" onclick="return handleExitUploadProcess('/profile')">
            <span class="profile-fab-head"></span>
            <span class="profile-fab-body"></span>
        </a>

        <div class="main-area">
            <div class="content-area">
                <form id="uploadForm" enctype="multipart/form-data">
                    <div class="upload-layout">

                        <div class="upload-panel upload-left-card">
                            <h1>Upload File</h1>

                            <div class="drop-zone" id="dropZone">
                                <div class="upload-icon">&uarr;</div>
                                <h4>Drag or select a file</h4>
                                <p id="selectedFileName">No file selected</p>
                                <p class="subtitle accepted-formats">
                                    Accepted formats: PDF, Word, Excel, PowerPoint, TXT, CSV, JPG, PNG, ZIP.
                                </p>

                                <input
                                    type="file"
                                    name="file"
                                    id="fileInput"
                                    accept=".pdf,.doc,.docx,.txt,.xls,.xlsx,.csv,.ppt,.pptx,.jpg,.jpeg,.png,.zip"
                                    hidden
                                    required>

                                <button type="button" class="choose-btn" id="chooseFileButton">Choose File</button>
                            </div>

                            <div class="button-row">
                                <button type="button" class="outline-btn" id="pauseUploadBtn" onclick="pauseUploadProcess()" disabled>Pause Upload</button>
                                <button type="button" class="outline-btn" id="resumeUploadBtn" onclick="resumeUploadProcess()" disabled>Resume Upload</button>
                                <button type="button" class="danger-btn" onclick="cancelUploadProcess()">Cancel Upload</button>
                            </div>

                            <div class="status-panel upload-right-card">
                                <div class="progress mt-3 upload-progress">
                                    <div id="uploadProgressBar"
                                         class="progress-bar"
                                         role="progressbar"
                                         style="width: 0%;">
                                        0%
                                    </div>
                                </div>

                                <p id="uploadStatusText" class="mt-3 status-text">
                                    0% uploaded.
                                </p>

                                <div class="status-box mt-4">
                                    <p>
                                        <strong>Current State:</strong>
                                        <span id="currentState">Idle</span>
                                    </p>

                                    <p>
                                        <strong>Name:</strong>
                                        <span id="statusFileName">-</span>
                                    </p>

                                    <p>
                                        <strong>Type:</strong>
                                        <span id="statusFileType">-</span>
                                    </p>

                                    <p>
                                        <strong>Size:</strong>
                                        <span id="statusFileSize">-</span>
                                    </p>
                                </div>

                                <div class="button-row">
                                    <button
                                        type="button"
                                        class="primary-btn"
                                        id="completeUploadBtn"
                                        disabled>
                                        Complete Upload
                                    </button>
                                </div>
                            </div>
                        </div>

                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        var fileInput = document.getElementById("fileInput");
        var dropZone = document.getElementById("dropZone");
        var chooseFileButton = document.getElementById("chooseFileButton");
        var completeUploadBtn = document.getElementById("completeUploadBtn");
        var pauseUploadBtn = document.getElementById("pauseUploadBtn");
        var resumeUploadBtn = document.getElementById("resumeUploadBtn");

        var CHUNK_SIZE = 256 * 1024;

        var currentRequest = null;
        var currentTempFileID = null;
        var currentUploadID = null;
        var currentFile = null;
        var uploadedBytes = 0;
        var uploadCompleted = false;
        var uploadPaused = false;

        chooseFileButton.addEventListener("click", function (event) {
            event.stopPropagation();
            fileInput.click();
        });

        dropZone.addEventListener("click", function () {
            fileInput.click();
        });

        dropZone.addEventListener("dragover", function (event) {
            event.preventDefault();
            dropZone.classList.add("drag-active");
        });

        dropZone.addEventListener("dragleave", function () {
            dropZone.classList.remove("drag-active");
        });

        dropZone.addEventListener("drop", function (event) {
            event.preventDefault();
            dropZone.classList.remove("drag-active");

            var droppedFiles = event.dataTransfer.files;

            if (droppedFiles.length > 0) {
                fileInput.files = droppedFiles;
                prepareUpload(droppedFiles[0]);
                startUploadSession();
            }
        });

        fileInput.addEventListener("change", function () {
            var file = fileInput.files[0];

            if (file) {
                prepareUpload(file);
                startUploadSession();
            }
        });

        completeUploadBtn.addEventListener("click", function () {
            if (uploadCompleted && currentTempFileID !== null) {
                window.location.href = "/upload/preview/" + currentTempFileID;
            }
        });

        function prepareUpload(file) {
            currentFile = file;
            currentRequest = null;
            currentTempFileID = null;
            currentUploadID = null;
            uploadedBytes = 0;
            uploadCompleted = false;
            uploadPaused = false;

            completeUploadBtn.disabled = true;
            pauseUploadBtn.disabled = true;
            resumeUploadBtn.disabled = true;

            document.getElementById("selectedFileName").innerText = file.name;
            document.getElementById("statusFileName").innerText = file.name;
            document.getElementById("statusFileType").innerText = file.type || "Unknown";
            document.getElementById("statusFileSize").innerText = formatFileSize(file.size);

            resetProgressBar();

            document.getElementById("currentState").innerText = "Uploading";
            document.getElementById("uploadStatusText").innerText = "Starting upload...";
        }

        function startUploadSession() {
            if (currentFile === null) {
                alert("Please select a file first.");
                return;
            }

            var formData = new FormData();
            formData.append("file_name", currentFile.name);
            formData.append("total_size", currentFile.size);

            var xhr = new XMLHttpRequest();
            currentRequest = xhr;

            xhr.onload = function () {
                currentRequest = null;

                if (xhr.status === 200) {
                    var response = JSON.parse(xhr.responseText);

                    currentUploadID = response.upload_id;
                    uploadedBytes = response.bytes_uploaded;
                    uploadPaused = false;

                    pauseUploadBtn.disabled = false;
                    resumeUploadBtn.disabled = true;

                    uploadNextChunk();
                } else {
                    handleUploadError(xhr, "Upload could not be started.");
                }
            };

            xhr.onerror = function () {
                currentRequest = null;
                markUploadFailed("Network error occurred while starting upload.");
            };

            xhr.open("POST", "/upload/start", true);
            xhr.send(formData);
        }

        function uploadNextChunk() {
            if (uploadPaused || currentFile === null || currentUploadID === null) {
                return;
            }

            if (uploadedBytes >= currentFile.size) {
                completeUploadSession();
                return;
            }

            var chunkEnd = Math.min(uploadedBytes + CHUNK_SIZE, currentFile.size);
            var chunk = currentFile.slice(uploadedBytes, chunkEnd);

            var formData = new FormData();
            formData.append("upload_id", currentUploadID);
            formData.append("chunk_start", uploadedBytes);
            formData.append("chunk", chunk);

            var xhr = new XMLHttpRequest();
            currentRequest = xhr;

            xhr.onload = function () {
                currentRequest = null;

                if (xhr.status === 200) {
                    var response = JSON.parse(xhr.responseText);

                    uploadedBytes = response.bytes_uploaded;
                    updateProgressDisplay(uploadedBytes, currentFile.size);
                    uploadNextChunk();
                } else {
                    handleUploadError(xhr, "Upload chunk could not be saved.");
                }
            };

            xhr.onerror = function () {
                currentRequest = null;
                markUploadFailed("Network error occurred during upload.");
            };

            xhr.onabort = function () {
                currentRequest = null;
            };

            xhr.open("POST", "/upload/chunk", true);
            xhr.send(formData);
        }

        function pauseUploadProcess() {
            if (currentUploadID === null || uploadCompleted) {
                return;
            }

            uploadPaused = true;

            if (currentRequest !== null) {
                currentRequest.abort();
                currentRequest = null;
            }

            var formData = new FormData();
            formData.append("upload_id", currentUploadID);

            var xhr = new XMLHttpRequest();

            xhr.onload = function () {
                if (xhr.status === 200) {
                    pauseUploadBtn.disabled = true;
                    resumeUploadBtn.disabled = false;
                    completeUploadBtn.disabled = true;

                    document.getElementById("currentState").innerText = "Paused";
                    document.getElementById("uploadStatusText").innerText = "Upload paused at " + getUploadPercent() + "%.";
                } else {
                    handleUploadError(xhr, "Upload progress could not be paused.");
                }
            };

            xhr.onerror = function () {
                markUploadFailed("Network error occurred while pausing upload.");
            };

            xhr.open("POST", "/upload/pause", true);
            xhr.send(formData);
        }

        function resumeUploadProcess() {
            if (currentUploadID === null || currentFile === null || uploadCompleted) {
                return;
            }

            var formData = new FormData();
            formData.append("upload_id", currentUploadID);

            var xhr = new XMLHttpRequest();
            currentRequest = xhr;

            xhr.onload = function () {
                currentRequest = null;

                if (xhr.status === 200) {
                    var response = JSON.parse(xhr.responseText);

                    uploadedBytes = response.bytes_uploaded;
                    uploadPaused = false;

                    pauseUploadBtn.disabled = false;
                    resumeUploadBtn.disabled = true;
                    completeUploadBtn.disabled = true;

                    document.getElementById("currentState").innerText = "Uploading";
                    document.getElementById("uploadStatusText").innerText = "Resuming upload...";

                    updateProgressDisplay(uploadedBytes, currentFile.size);
                    uploadNextChunk();
                } else {
                    handleUploadError(xhr, "Upload could not be resumed.");
                }
            };

            xhr.onerror = function () {
                currentRequest = null;
                markUploadFailed("Network error occurred while resuming upload.");
            };

            xhr.open("POST", "/upload/resume", true);
            xhr.send(formData);
        }

        function completeUploadSession() {
            var formData = new FormData();
            formData.append("upload_id", currentUploadID);
            formData.append("file_type", currentFile.type || "Unknown");

            var xhr = new XMLHttpRequest();
            currentRequest = xhr;

            xhr.onload = function () {
                currentRequest = null;

                if (xhr.status === 200) {
                    var response = JSON.parse(xhr.responseText);

                    currentTempFileID = response.file_id;
                    uploadCompleted = true;
                    uploadPaused = false;

                    updateProgressDisplay(currentFile.size, currentFile.size);

                    document.getElementById("uploadProgressBar").classList.add("bg-success");
                    document.getElementById("currentState").innerText = "Completed";
                    document.getElementById("uploadStatusText").innerText = "100% uploaded. You may continue to preview.";

                    pauseUploadBtn.disabled = true;
                    resumeUploadBtn.disabled = true;
                    completeUploadBtn.disabled = false;
                } else {
                    handleUploadError(xhr, "Upload could not be completed.");
                }
            };

            xhr.onerror = function () {
                currentRequest = null;
                markUploadFailed("Network error occurred while completing upload.");
            };

            xhr.open("POST", "/upload/complete", true);
            xhr.send(formData);
        }

        function cancelUploadProcess() {
            uploadPaused = true;

            if (currentRequest !== null) {
                currentRequest.abort();
                currentRequest = null;
            }

            if (currentTempFileID !== null) {
                cancelTempUpload(currentTempFileID, null);
            } else if (currentUploadID !== null) {
                cancelUploadSession(currentUploadID, null);
            }

            clearUploadDisplay();
            document.getElementById("currentState").innerText = "Cancelled";
            document.getElementById("uploadStatusText").innerText = "Upload cancelled.";
        }

        function handleExitUploadProcess(targetURL) {
            if (currentTempFileID !== null) {
                cancelTempUpload(currentTempFileID, targetURL);
                return false;
            }

            if (currentUploadID !== null && !uploadCompleted) {
                cancelUploadSession(currentUploadID, targetURL);
                return false;
            }

            return true;
        }

        function cancelTempUpload(fileID, targetURL) {
            var xhr = new XMLHttpRequest();

            xhr.onload = function () {
                currentTempFileID = null;

                if (targetURL !== null) {
                    window.location.href = targetURL;
                }
            };

            xhr.open("POST", "/upload/cancel/" + fileID, true);
            xhr.send();
        }

        function cancelUploadSession(uploadID, targetURL) {
            var xhr = new XMLHttpRequest();

            xhr.onload = function () {
                currentUploadID = null;

                if (targetURL !== null) {
                    window.location.href = targetURL;
                }
            };

            xhr.open("POST", "/upload/cancel-session/" + uploadID, true);
            xhr.send();
        }

        function clearUploadDisplay() {
            fileInput.value = "";
            currentRequest = null;
            currentTempFileID = null;
            currentUploadID = null;
            currentFile = null;
            uploadedBytes = 0;
            uploadCompleted = false;
            uploadPaused = false;

            completeUploadBtn.disabled = true;
            pauseUploadBtn.disabled = true;
            resumeUploadBtn.disabled = true;

            document.getElementById("selectedFileName").innerText = "No file selected";
            document.getElementById("statusFileName").innerText = "-";
            document.getElementById("statusFileType").innerText = "-";
            document.getElementById("statusFileSize").innerText = "-";

            resetProgressBar();
        }

        function resetProgressBar() {
            var progressBar = document.getElementById("uploadProgressBar");

            progressBar.style.width = "0%";
            progressBar.innerText = "0%";
            progressBar.classList.remove("bg-success", "bg-danger");

            document.getElementById("uploadStatusText").innerText = "0% uploaded.";
        }

        function updateProgressDisplay(currentBytes, totalBytes) {
            var progressBar = document.getElementById("uploadProgressBar");
            var percent = Math.round((currentBytes / totalBytes) * 100);

            progressBar.classList.remove("bg-danger");
            progressBar.style.width = percent + "%";
            progressBar.innerText = percent + "%";

            document.getElementById("uploadStatusText").innerText = percent + "% uploaded.";
        }

        function getUploadPercent() {
            if (currentFile === null || currentFile.size === 0) {
                return 0;
            }

            return Math.round((uploadedBytes / currentFile.size) * 100);
        }

        function handleUploadError(xhr, defaultMessage) {
            try {
                var errorResponse = JSON.parse(xhr.responseText);
                markUploadFailed(errorResponse.message || defaultMessage);
            } catch (e) {
                markUploadFailed(defaultMessage);
            }
        }

        function markUploadFailed(message) {
            var progressBar = document.getElementById("uploadProgressBar");

            currentRequest = null;
            progressBar.classList.add("bg-danger");
            document.getElementById("currentState").innerText = "Failed";
            document.getElementById("uploadStatusText").innerText = message;

            pauseUploadBtn.disabled = true;
            resumeUploadBtn.disabled = true;
            completeUploadBtn.disabled = true;
        }

        function formatFileSize(sizeInBytes) {
            var sizeInKB = sizeInBytes / 1024;
            var sizeInMB = sizeInKB / 1024;

            if (sizeInMB >= 1) {
                return sizeInMB.toFixed(1) + " MB";
            }

            return sizeInKB.toFixed(2) + " KB";
        }
    </script>
</body>
</html>
